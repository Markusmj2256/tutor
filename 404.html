<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokaltutor er flyttet</title>
  <link rel="canonical" href="https://lokaltutor.pages.dev/">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=https://lokaltutor.pages.dev/">
  <style>
    body { margin:0; min-height:100svh; display:grid; place-items:center;
           font-family: system-ui, -apple-system, sans-serif; background:#fbfaf7; color:#3c382f; }
    .card { text-align:center; padding:32px; max-width:34ch; }
    h1 { font-size:1.3rem; color:#211e19; margin:0 0 10px; }
    p { margin:0 0 20px; color:#6f685c; line-height:1.6; }
    a { display:inline-block; padding:13px 26px; border-radius:999px; text-decoration:none;
        font-weight:700; color:#2a1d04;
        background:linear-gradient(135deg,#f2be6a,#e0a03c 50%,#c9811a); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Siden er flyttet</h1>
    <p>Lokaltutor ligger nu på en ny adresse. Du bliver sendt videre automatisk.</p>
    <a href="https://lokaltutor.pages.dev/">Gå til lokaltutor.vercel.app</a>
  </div>
  <script>
    // Bevar stien, så et link til fx /tutor/holdundervisning.html lander rigtigt.
    // Cloudflare Pages serverer stierne uden .html, så endelsen fjernes her —
    // ellers ville besøgende ramme endnu en viderestilling.
    (function () {
      var path = location.pathname.replace(/^\/tutor\/?/, "").replace(/\.html$/, "");
      if (path === "index") path = "";
      location.replace("https://lokaltutor.pages.dev/" + path + location.search + location.hash);
    })();
  </script>
</body>
</html>
